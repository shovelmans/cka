apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apache-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shovelmans/cka.git
    targetRevision: main
    path: charts/apache-demo
    helm:
      releaseName: apache-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: apache-demo
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
