apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-ca
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shovelmans/cka.git
    targetRevision: main
    path: manifests/cert-manager-ca
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
