kube-prometheus-stack:
  grafana:
    service:
      type: NodePort
      nodePort: 30300
    adminPassword: "admin12345"
    sidecar:
      alerts:
        enabled: true
        label: grafana_alert
        labelValue: "1"
        searchNamespace: ALL
    grafana.ini:
      smtp:
        enabled: true
        host: smtp.gmail.com:587
        user: vjorgem95@gmail.com
        from_address: vjorgem95@gmail.com
        from_name: Grafana Harbor Alerts
        startTLS_policy: MandatoryStartTLS
    envFromSecret: smtp-gmail-credentials

  prometheus:
    service:
      type: NodePort
      nodePort: 30900
    prometheusSpec:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 300m
          memory: 512Mi

  alertmanager:
    service:
      type: NodePort
      nodePort: 30903
    alertmanagerSpec:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
