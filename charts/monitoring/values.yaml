kube-prometheus-stack:
  grafana:
    service:
      type: NodePort
      nodePort: 30300
    adminPassword: "admin12345"

  prometheus:
    service:
      type: NodePort
      nodePort: 30900
    prometheusSpec:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 300m
          memory: 512Mi

  alertmanager:
    service:
      type: NodePort
      nodePort: 30903
    alertmanagerSpec:
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
