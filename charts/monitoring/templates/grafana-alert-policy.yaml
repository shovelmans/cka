apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-harbor-notification-policy
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: telegram-harbor
        group_by: ["alertname", "namespace"]
        routes:
          - receiver: telegram-harbor
            object_matchers:
              - ["namespace", "=", "harbor"]
            group_wait: 10s
            group_interval: 30s
            repeat_interval: 30s
            continue: false
