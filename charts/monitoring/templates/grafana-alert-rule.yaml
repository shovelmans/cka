apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-harbor-alert-rule
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  harbor-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: harbor-namespace-alerts
        folder: Harbor
        interval: 10s
        rules:
          - uid: harbor-pod-not-ready
            title: HarborPodNotReady (Grafana)
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: sum(kube_pod_status_ready{namespace="harbor", condition="false"}) or vector(0)
                  instant: true
                  refId: A
              - refId: C
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "__expr__"
                model:
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
                  refId: C
            noDataState: OK
            execErrState: Alerting
            for: 2m
            labels:
              severity: critical
              namespace: harbor
            annotations:
              summary: "Al menos un pod de harbor no está Ready"
              description: "Hay uno o más pods en el namespace harbor sin estar Ready desde hace más de 2 minutos."
